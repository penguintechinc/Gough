# Beta environment overrides (dal2 cluster)
namespace: gough
replicaCount: 2
image:
  registry: ghcr.io/penguintechinc/gough
  pullPolicy: Always
imagePullSecrets:
  - name: ghcr-pull-secret
env:
  - name: LOG_LEVEL
    value: "INFO"
configMapData:
  api-manager-url: "http://api-manager:8080"
  worker-id: "worker-ipxe-beta"
  dhcp-mode: "proxy"
  dhcp-interface: "eth0"
  tftp-enabled: "true"
  tftp-port: "69"
  http-port: "8080"
  storage-endpoint: "http://minio:9000"
  storage-bucket-boot-images: "boot-images"
  storage-bucket-biomes: "biomes"
  storage-use-ssl: "true"
  heartbeat-interval: "30"
  log-level: "INFO"
  metrics-enabled: "true"
  metrics-port: "9090"
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 125m
    memory: 256Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
