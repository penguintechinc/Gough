# Alpha environment overrides (local MicroK8s)
namespace: gough
replicaCount: 1
image:
  pullPolicy: Never
env:
  - name: LOG_LEVEL
    value: "DEBUG"
configMapData:
  api-manager-url: "http://api-manager:8080"
  worker-id: "worker-ipxe-alpha"
  dhcp-mode: "proxy"
  dhcp-interface: "eth0"
  tftp-enabled: "true"
  tftp-port: "69"
  http-port: "8080"
  storage-endpoint: "http://minio:9000"
  storage-bucket-boot-images: "boot-images"
  storage-bucket-biomes: "biomes"
  storage-use-ssl: "false"
  heartbeat-interval: "30"
  log-level: "DEBUG"
  metrics-enabled: "true"
  metrics-port: "9090"
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi
autoscaling:
  enabled: false
