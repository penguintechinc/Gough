replicaCount: 1

image:
  repository: ghcr.io/penguintechinc/gough/worker-ipxe
  pullPolicy: IfNotPresent
  tag: "v0.0.0"  # override per-env; production requires an immutable vX.Y.Z tag or @sha256 digest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# ROOT EXCEPTION (approved): worker-ipxe answers DHCP (67/udp) and TFTP
# (69/udp) requests, both privileged (<1024) ports. Rather than running as
# root, the container keeps runAsNonRoot/runAsUser and is granted only the
# CAP_NET_BIND_SERVICE capability needed to bind those ports. All other
# capabilities are dropped and the process never runs as UID 0.
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

service:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: tftp
      port: 69
      targetPort: tftp
      protocol: UDP
    - name: proxydhcp
      port: 4011
      targetPort: proxydhcp
      protocol: UDP
    - name: dhcp
      port: 67
      targetPort: dhcp
      protocol: UDP
  annotations: {}

# worker-ipxe is reached directly by booting hardware over DHCP/TFTP/HTTP on
# the provisioning network, not through cluster ingress - stays disabled in
# every environment; template kept for chart-structure parity.
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: worker-ipxe.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

httproute:
  enabled: false
  gatewayName: shared
  gatewayNamespace: gateway
  host: ""
  rules: []

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env:
  - name: API_MANAGER_URL
    valueFrom:
      configMapKeyRef:
        name: worker-ipxe-config
        key: api-manager-url
  - name: WORKER_API_KEY
    valueFrom:
      secretKeyRef:
        name: worker-ipxe-secret
        key: worker-api-key
  - name: WORKER_ID
    valueFrom:
      configMapKeyRef:
        name: worker-ipxe-config
        key: worker-id
  - name: DHCP_MODE
    valueFrom:
      configMapKeyRef:
        name: worker-ipxe-config
        key: dhcp-mode
  - name: DHCP_INTERFACE
    valueFrom:
      configMapKeyRef:
        name: worker-ipxe-config
        key: dhcp-interface
  - name: TFTP_ENABLED
    valueFrom:
      configMapKeyRef:
        name: worker-ipxe-config
        key: tftp-enabled
  - name: TFTP_PORT
    valueFrom:
      configMapKeyRef:
        name: worker-ipxe-config
        key: tftp-port
  - name: HTTP_PORT
    valueFrom:
      configMapKeyRef:
        name: worker-ipxe-config
        key: http-port
  - name: STORAGE_ENDPOINT
    valueFrom:
      configMapKeyRef:
        name: worker-ipxe-config
        key: storage-endpoint
  - name: STORAGE_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: worker-ipxe-secret
        key: storage-access-key
  - name: STORAGE_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: worker-ipxe-secret
        key: storage-secret-key
  - name: STORAGE_BUCKET_BOOT_IMAGES
    valueFrom:
      configMapKeyRef:
        name: worker-ipxe-config
        key: storage-bucket-boot-images
  - name: STORAGE_BUCKET_BIOMES
    valueFrom:
      configMapKeyRef:
        name: worker-ipxe-config
        key: storage-bucket-biomes
  - name: STORAGE_USE_SSL
    valueFrom:
      configMapKeyRef:
        name: worker-ipxe-config
        key: storage-use-ssl
  - name: HEARTBEAT_INTERVAL
    valueFrom:
      configMapKeyRef:
        name: worker-ipxe-config
        key: heartbeat-interval
  - name: LOG_LEVEL
    valueFrom:
      configMapKeyRef:
        name: worker-ipxe-config
        key: log-level
  - name: METRICS_ENABLED
    valueFrom:
      configMapKeyRef:
        name: worker-ipxe-config
        key: metrics-enabled
  - name: METRICS_PORT
    valueFrom:
      configMapKeyRef:
        name: worker-ipxe-config
        key: metrics-port
  - name: SPIRE_AGENT_SOCKET
    value: "unix:///run/spire/agent.sock"

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

# readOnlyRootFilesystem requires a writable /tmp - dnsmasq lease/pid files
# and Python tempfile-generated dnsmasq config land there (see
# worker/services/dhcp_server.py).
volumeMounts:
  - name: tmp
    mountPath: /tmp

volumes:
  - name: tmp
    emptyDir: {}

configMapData:
  api-manager-url: "http://api-manager:8080"
  worker-id: "worker-ipxe-1"
  dhcp-mode: "proxy"
  dhcp-interface: "eth0"
  tftp-enabled: "true"
  tftp-port: "69"
  http-port: "8080"
  storage-endpoint: "http://minio:9000"
  storage-bucket-boot-images: "boot-images"
  storage-bucket-biomes: "biomes"
  storage-use-ssl: "false"
  heartbeat-interval: "30"
  log-level: "INFO"
  metrics-enabled: "true"
  metrics-port: "9090"

# Secrets are NOT rendered by this chart. The Deployment references the Secret
# named "<release>-worker-ipxe-secret", which MUST be provisioned out-of-band by
# Vault, the External Secrets Operator, or Sealed Secrets (see devops standards).
# Required keys: worker-api-key, storage-access-key, storage-secret-key.
