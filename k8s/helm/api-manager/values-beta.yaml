# Beta environment overrides (dal2 cluster)
namespace: gough
replicaCount: 2
image:
  registry: ghcr.io/penguintechinc/gough
  pullPolicy: Always
imagePullSecrets:
  - name: ghcr-pull-secret
env:
  - name: LOG_LEVEL
    value: "INFO"
  - name: RELEASE_MODE
    value: "false"
  # penguin-aaa ES256 OIDC — see values.yaml for the shared-keystore rationale.
  - name: OIDC_ISSUER
    value: "https://gough.penguintech.cloud"
  - name: OIDC_AUDIENCE
    value: "gough-api"
  - name: GOUGH_KEY_STORE_PATH
    value: "/var/gough/keys/oidc_keys.json"
ingress:
  enabled: false
  className: "nginx"
  hosts:
    - host: gough.penguintech.cloud
      paths:
        - path: /api/v1
          pathType: Prefix
  tls:
    - secretName: penguintech-wildcard-tls
      hosts:
        - gough.penguintech.cloud

httproute:
  enabled: true
  gatewayName: dal2-gateway
  gatewayNamespace: cilium-gateway
  host: "gough.penguintech.cloud"
  rules:
    - path: /api/v1
      service: "api-manager"
      port: 80

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 125m
    memory: 256Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
