replicaCount: 1

image:
  repository: ghcr.io/penguintechinc/gough/api-manager
  pullPolicy: IfNotPresent
  tag: "v0.0.0"  # override per-env; production requires an immutable vX.Y.Z tag or @sha256 digest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080
  targetPort: 5000
  grpcPort: 50051
  grpcTargetPort: 50051
  annotations: {}

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: api.example.com
      paths:
        - path: /api/v1
          pathType: Prefix
  tls: []

httproute:
  enabled: false
  gatewayName: shared
  gatewayNamespace: gateway
  host: ""
  rules: []

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env:
  - name: QUART_ENV
    value: "production"
  - name: QUART_PORT
    value: "5000"
  - name: SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: api-manager-secret
        key: secret-key
  - name: SECURITY_PASSWORD_SALT
    valueFrom:
      secretKeyRef:
        name: api-manager-secret
        key: password-salt
  - name: DB_TYPE
    valueFrom:
      configMapKeyRef:
        name: api-manager-config
        key: db-type
  - name: DB_HOST
    valueFrom:
      configMapKeyRef:
        name: api-manager-config
        key: db-host
  - name: DB_PORT
    valueFrom:
      configMapKeyRef:
        name: api-manager-config
        key: db-port
  - name: DB_NAME
    valueFrom:
      configMapKeyRef:
        name: api-manager-config
        key: db-name
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: api-manager-secret
        key: db-user
  - name: DB_PASS
    valueFrom:
      secretKeyRef:
        name: api-manager-secret
        key: db-pass
  - name: DB_POOL_SIZE
    valueFrom:
      configMapKeyRef:
        name: api-manager-config
        key: db-pool-size
  - name: LICENSE_KEY
    valueFrom:
      secretKeyRef:
        name: api-manager-secret
        key: license-key
  - name: LICENSE_SERVER_URL
    valueFrom:
      configMapKeyRef:
        name: api-manager-config
        key: license-server-url
  - name: RELEASE_MODE
    valueFrom:
      configMapKeyRef:
        name: api-manager-config
        key: release-mode
  - name: VAULT_ADDR
    valueFrom:
      configMapKeyRef:
        name: api-manager-config
        key: vault-addr
  - name: SPIRE_AGENT_SOCKET
    value: "unix:///run/spire/agent.sock"
  - name: REDIS_URL
    valueFrom:
      configMapKeyRef:
        name: api-manager-config
        key: redis-url

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

volumeMounts: []

volumes: []

configMapData:
  db-type: "postgres"
  db-host: "postgres"
  db-port: "5432"
  db-name: "gough_api"
  db-pool-size: "5"
  vault-addr: "http://vault:8200"
  redis-url: "redis://redis:6379"
  license-server-url: "https://license.penguintech.io"
  release-mode: "false"

# Secrets are NOT rendered by this chart. The Deployment references the Secret
# named "<release>-api-manager-secret", which MUST be provisioned out-of-band by
# Vault, the External Secrets Operator, or Sealed Secrets (see devops standards).
# Required keys: secret-key, password-salt, db-user, db-pass, license-key.
