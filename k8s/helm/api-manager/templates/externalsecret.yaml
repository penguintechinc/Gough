{{/*
Optional External Secrets Operator stub for the penguin-aaa ES256 OIDC
keystore. Disabled by default (externalSecret.enabled=false) — enable and
point secretStoreRef at a real Vault-backed SecretStore/ClusterSecretStore
once ESO is provisioned in the target cluster. This is the preferred way to
populate the "api-manager-oidc-keystore" Secret referenced by the Deployment
volume; see the chart README.md for the keygen + Vault write procedure.
*/}}
{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.keystoreSecret.secretName }}
  labels:
    {{- include "api-manager.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.keystoreSecret.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.keystoreSecret.dataKey }}
      remoteRef:
        key: {{ .Values.externalSecret.vaultPath }}
        property: {{ .Values.externalSecret.vaultProperty }}
{{- end }}
