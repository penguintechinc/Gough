{{/*
Optional, disabled-by-default Secret for the penguin-aaa ES256 OIDC keystore.

This template NEVER renders in a normal install (keystoreSecret.create
defaults to false in values.yaml). It exists only as a placeholder/template
for disposable local dev installs where an operator explicitly opts in and
supplies non-production key material via keystoreSecret.data. Production,
beta, and gamma MUST provision the "api-manager-oidc-keystore" Secret
out-of-band (kubectl, Sealed Secrets, or the ExternalSecret in
externalsecret.yaml) — see the chart README.md.
*/}}
{{- if .Values.keystoreSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.keystoreSecret.secretName }}
  labels:
    {{- include "api-manager.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  {{- range $key, $value := .Values.keystoreSecret.data }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
