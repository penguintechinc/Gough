# Beta environment overrides (dal2 cluster)
namespace: gough
replicaCount: 2
image:
  registry: ghcr.io/penguintechinc/gough
  pullPolicy: Always
imagePullSecrets:
  - name: ghcr-pull-secret
env:
  - name: LOG_LEVEL
    value: "INFO"
  - name: RELEASE_MODE
    value: "false"
ingress:
  enabled: false
  className: "nginx"
  hosts:
    - host: gough.penguintech.cloud
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: penguintech-wildcard-tls
      hosts:
        - gough.penguintech.cloud

httproute:
  enabled: true
  gatewayName: shared
  gatewayNamespace: gateway
  host: "gough.penguintech.cloud"
  rules:
    - path: /
      service: "webui"
      port: 80

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 75m
    memory: 128Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
