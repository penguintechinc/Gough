# Gateway API HTTPRoute — replaces legacy nginx Ingress (ingress.yaml)
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gough
  namespace: gough
  labels:
    app.kubernetes.io/name: gough
    app.kubernetes.io/component: routing
    app.kubernetes.io/managed-by: helm
spec:
  parentRefs:
    - name: dal2-gateway
      namespace: cilium-gateway
  hostnames:
    - "gough.penguintech.cloud"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v2
      backendRefs:
        - name: go-backend
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      backendRefs:
        - name: flask-backend
          port: 5000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: webui
          port: 3000
