version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/penguintechinc/gough/services/discovery-agent
plugins:
  - remote: buf.build/protocolbuffers/go:v1.34.2
    out: internal/grpcgen
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: internal/grpcgen
    opt:
      - paths=source_relative
