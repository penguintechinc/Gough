# Ruff config — canonical block, identical across PenguinTech repos.
# See ~/code/admin/.claude/rules/backend-python.md.
#
# Applies repo-wide (access-agent, api-manager, worker-ipxe, root tooling).
# flake8/black/isort are removed — ruff replaces all three.
[tool.ruff]
target-version = "py312"     # py313 once fully migrated — see general.md
line-length = 100            # matches Prettier printWidth + dart format
exclude = [
    ".worktrees",
    "services/webui",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"
