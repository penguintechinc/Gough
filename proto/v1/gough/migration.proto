syntax = "proto3";

package gough.v1;

option go_package = "github.com/penguintechinc/gough/services/discovery-agent/internal/grpcgen/gough/v1";

service Migration {
  rpc PolicyGet(PolicyGetRequest) returns (PolicyGetResponse);
  rpc PolicyPatch(PolicyPatchRequest) returns (PolicyPatchResponse);
  rpc Trigger(TriggerRequest) returns (TriggerResponse);
  rpc EventStream(MigrationEventStreamRequest) returns (stream MigrationEventStreamResponse);
  rpc SafetyEnvelope(SafetyEnvelopeRequest) returns (SafetyEnvelopeResponse);
}

message PolicyGetRequest {
  string policy_id = 1;
}

message PolicyGetResponse {
  string policy_id = 1;
  string policy_data = 2;
}

message PolicyPatchRequest {
  string policy_id = 1;
  string patch_data = 2;
}

message PolicyPatchResponse {
  string policy_id = 1;
  string policy_data = 2;
}

message TriggerRequest {
  int64 instance_id = 1;
  int64 target_node_id = 2;
  string strategy = 3;
  bool drain_first = 4;
}

message TriggerResponse {
  string migration_id = 1;
}

message MigrationEventStreamRequest {
  string filter = 1;
  repeated string event_types = 2;
}

message MigrationEventStreamResponse {
  string event_type = 1;
  string payload = 2;
  string timestamp = 3;
}

message SafetyEnvelopeRequest {
  string envelope_data = 1;
}

message SafetyEnvelopeResponse {
  bool valid = 1;
  string validation_result = 2;
}
