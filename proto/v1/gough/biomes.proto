syntax = "proto3";

package gough.v1;

option go_package = "github.com/penguintechinc/gough/services/discovery-agent/internal/grpcgen/gough/v1";

service Biomes {
  rpc List(BiomeListRequest) returns (BiomeListResponse);
  rpc Get(BiomeGetRequest) returns (BiomeGetResponse);
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Sign(SignRequest) returns (SignResponse);
  rpc Upgrade(UpgradeRequest) returns (UpgradeResponse);
  rpc EligibilityCheck(EligibilityCheckRequest) returns (EligibilityCheckResponse);
  rpc Validate(ValidateRequest) returns (ValidateResponse);
  rpc Publish(PublishRequest) returns (PublishResponse);
  rpc DeployBiome(DeployBiomeRequest) returns (DeployBiomeResponse);
  rpc VerifySignature(VerifySignatureRequest) returns (VerifySignatureResponse);
}

message BiomeListRequest {
  string filter = 1;
  string sort_by = 2;
  int32 limit = 3;
  string cursor = 4;
}

message BiomeListResponse {
  repeated Biome biomes = 1;
  string next_cursor = 2;
}

message BiomeGetRequest {
  int64 biome_id = 1;
}

message BiomeGetResponse {
  Biome biome = 1;
}

message CreateRequest {
  string name = 1;
  string description = 2;
  string version = 3;
  bytes payload = 4;
}

message CreateResponse {
  int64 biome_id = 1;
}

message UpdateRequest {
  int64 biome_id = 1;
  string update_data = 2;
}

message UpdateResponse {
  Biome biome = 1;
}

message DeleteRequest {
  int64 biome_id = 1;
}

message DeleteResponse {
  string status = 1;
}

message SignRequest {
  int64 biome_id = 1;
  string signing_key_ref = 2;
}

message SignResponse {
  string signature = 1;
  string signature_type = 2;
}

message UpgradeRequest {
  int64 biome_id = 1;
  string new_version = 2;
}

message UpgradeResponse {
  string status = 1;
  string upgrade_id = 2;
}

message EligibilityCheckRequest {
  int64 biome_id = 1;
  int64 node_id = 2;
}

message EligibilityCheckResponse {
  bool eligible = 1;
  repeated string reasons = 2;
}

message ValidateRequest {
  int64 biome_id = 1;
}

message ValidateResponse {
  bool valid = 1;
  repeated string errors = 2;
}

message PublishRequest {
  int64 biome_id = 1;
  string target_repo = 2;
}

message PublishResponse {
  string status = 1;
  string publication_id = 2;
}

message Biome {
  int64 id = 1;
  string name = 2;
  string version = 3;
  string state = 4;
  int64 created_at = 5;
}

message DeployBiomeRequest {
  int64 biome_id = 1;
  int64 node_id = 2;
  string config = 3;
  map<string, string> params = 4;
}

message DeployBiomeResponse {
  string deployment_id = 1;
  string status = 2;
}

message VerifySignatureRequest {
  int64 biome_id = 1;
  string pubkey = 2;
}

message VerifySignatureResponse {
  bool verified = 1;
  string reason = 2;
}
