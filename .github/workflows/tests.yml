name: Gough Testing Pipeline

on:
  push:
    branches: [ main, v1.x ]
    paths:
      - 'services/**'
      - 'tests/**'
      - '.version'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [ main, v1.x ]
    paths:
      - 'services/**'
      - 'tests/**'
      - '.version'
      - '.github/workflows/tests.yml'
  schedule:
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '24'

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 2

    - name: Set up Python
      uses: actions/setup-python@42375524c64b4a2f71e0a3c5f03cb4b1cac8f5b
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@e12d46a7a8694bfa80c3f053bf91a4b266cffdb0
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}-${{ hashFiles('tests/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install -r tests/requirements.txt
        if [ -f requirements.txt ]; then pip3 install -r requirements.txt; fi

    - name: Run unit tests with coverage
      run: |
        pytest tests/unit/ -v --cov=app --cov-report=xml --cov-report=term --cov-fail-under=90
      env:
        CI: true
        TESTING: 1

    - name: Upload unit test results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: unit-test-results
        path: |
          .coverage
          htmlcov/

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@ad3126e916f76a496688b3b9717a5bdf6a43eded
      with:
        files: ./coverage.xml
        flags: unit-tests
        name: unit-tests

  lint-and-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Set up Python
      uses: actions/setup-python@42375524c64b4a2f71e0a3c5f03cb4b1cac8f5b
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install linting tools
      run: |
        python3 -m pip install --upgrade pip
        pip3 install flake8 black isort mypy bandit safety
        pip3 install -r tests/requirements.txt

    - name: Run Black (code formatting check)
      run: black --check --diff services/ tests/

    - name: Run isort (import sorting check)
      run: isort --check-only --diff services/ tests/

    - name: Run flake8 (style guide)
      run: flake8 services/ tests/

    - name: Run mypy (type checking)
      run: mypy --strict services/

    - name: Run bandit (security analysis)
      run: bandit -r services/ -f json -o bandit-report.json || true

    - name: Run safety (dependency security)
      run: safety check --json || true

    - name: Upload lint results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: lint-results
        path: |
          bandit-report.json

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:16-bookworm@sha256:aefb61c5ac3326e56a7b769fa655fe00af0e335c1b9b65182bd6f6233dd12aad
        env:
          POSTGRES_DB: gough_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-bookworm@sha256:3e0669e42d4fe421c9dea0ba5fbc04d336b80b4f32a6c7d25bee3a1d089288a1
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Set up Python
      uses: actions/setup-python@42375524c64b4a2f71e0a3c5f03cb4b1cac8f5b
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@e12d46a7a8694bfa80c3f053bf91a4b266cffdb0
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-integration-${{ hashFiles('**/requirements.txt') }}

    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install -r tests/requirements.txt
        if [ -f requirements.txt ]; then pip3 install -r requirements.txt; fi

    - name: Wait for services
      run: |
        until pg_isready -h localhost -p 5432 -U test_user; do sleep 1; done
        until redis-cli -h localhost -p 6379 ping; do sleep 1; done

    - name: Run integration tests with coverage
      run: |
        pytest tests/integration/ -v --cov=app --cov-report=xml --cov-fail-under=90
      env:
        CI: true
        TESTING: 1
        DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/gough_test
        REDIS_URL: redis://localhost:6379/1

    - name: Upload integration test results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: integration-test-results
        path: |
          .coverage
          htmlcov/

  test-security:
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:16-bookworm@sha256:aefb61c5ac3326e56a7b769fa655fe00af0e335c1b9b65182bd6f6233dd12aad
        env:
          POSTGRES_DB: gough_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-bookworm@sha256:3e0669e42d4fe421c9dea0ba5fbc04d336b80b4f32a6c7d25bee3a1d089288a1
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Set up Python
      uses: actions/setup-python@42375524c64b4a2f71e0a3c5f03cb4b1cac8f5b
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install -r tests/requirements.txt

    - name: Run security tests
      run: |
        pytest tests/security/ -v
      env:
        CI: true
        TESTING: 1
        DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/gough_test
        REDIS_URL: redis://localhost:6379/1

    - name: Upload security test results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: security-test-results
        path: |
          .coverage

  test-workers:
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:16-bookworm@sha256:aefb61c5ac3326e56a7b769fa655fe00af0e335c1b9b65182bd6f6233dd12aad
        env:
          POSTGRES_DB: gough_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-bookworm@sha256:3e0669e42d4fe421c9dea0ba5fbc04d336b80b4f32a6c7d25bee3a1d089288a1
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Set up Python
      uses: actions/setup-python@42375524c64b4a2f71e0a3c5f03cb4b1cac8f5b
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install -r tests/requirements.txt
        if [ -f requirements.txt ]; then pip3 install -r requirements.txt; fi

    - name: Run worker tests with coverage
      run: |
        pytest tests/workers/ -v --cov=app --cov-report=xml --cov-fail-under=90
      env:
        CI: true
        TESTING: 1
        DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/gough_test
        REDIS_URL: redis://localhost:6379/1

    - name: Upload worker test results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: worker-test-results
        path: |
          .coverage
          htmlcov/

  test-api:
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:16-bookworm@sha256:aefb61c5ac3326e56a7b769fa655fe00af0e335c1b9b65182bd6f6233dd12aad
        env:
          POSTGRES_DB: gough_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-bookworm@sha256:3e0669e42d4fe421c9dea0ba5fbc04d336b80b4f32a6c7d25bee3a1d089288a1
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Set up Python
      uses: actions/setup-python@42375524c64b4a2f71e0a3c5f03cb4b1cac8f5b
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install -r tests/requirements.txt
        if [ -f requirements.txt ]; then pip3 install -r requirements.txt; fi

    - name: Run API tests
      run: |
        pytest tests/api/ -v
      env:
        CI: true
        TESTING: 1
        DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/gough_test
        REDIS_URL: redis://localhost:6379/1

    - name: Upload API test results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: api-test-results
        path: |
          .coverage

  discovery-agent-tests:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Set up Go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
      with:
        go-version: '1.24'

    - name: Run Go tests with race detection
      run: |
        cd services/discovery-agent
        go test -v -race -cover ./...

    - name: Run Go vet
      run: |
        cd services/discovery-agent
        go vet ./...

    - name: Run govulncheck
      run: |
        cd services/discovery-agent
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

    - name: Upload discovery agent test results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: discovery-agent-test-results
        path: services/discovery-agent/coverage/

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, test-workers]
    if: github.event_name == 'push' || github.event_name == 'schedule'

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Set up Python
      uses: actions/setup-python@42375524c64b4a2f71e0a3c5f03cb4b1cac8f5b
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install -r tests/requirements.txt

    - name: Check QEMU availability
      id: qemu-check
      run: |
        if command -v qemu-system-aarch64 &> /dev/null; then
          echo "available=true" >> $GITHUB_OUTPUT
        else
          echo "available=false" >> $GITHUB_OUTPUT
        fi

    - name: Run E2E tests (M1 simulation)
      if: steps.qemu-check.outputs.available == 'true'
      run: |
        pytest tests/e2e/m1/ -v
      env:
        CI: true
        TESTING: 1

    - name: Skip E2E tests (QEMU unavailable)
      if: steps.qemu-check.outputs.available == 'false'
      run: |
        pytest tests/e2e/m1/ -v --co -q
        echo "QEMU not available; E2E tests skipped"

    - name: Upload E2E test results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: e2e-test-results
        path: |
          .coverage
          htmlcov/

  security-scan:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Run Trivy filesystem scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        trivy-version: 'v0.69.3'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@181d5eefc20863364f96762470ba6f862bdef56b
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@181d5eefc20863364f96762470ba6f862bdef56b
      with:
        languages: 'python,go'

    - name: Autobuild
      uses: github/codeql-action/autobuild@181d5eefc20863364f96762470ba6f862bdef56b

    - name: Perform CodeQL analysis
      uses: github/codeql-action/analyze@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d

  test-report:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, lint-and-quality, test-security, test-workers, test-api, discovery-agent-tests]
    if: always()

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Download all test artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        path: artifacts/

    - name: Set up Python
      uses: actions/setup-python@42375524c64b4a2f71e0a3c5f03cb4b1cac8f5b
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Generate test summary
      run: |
        mkdir -p test-reports
        cat > test-reports/summary.txt << 'EOF'
        Test Execution Summary
        =====================

        Workflow Run: ${{ github.run_number }}
        Commit: ${{ github.sha }}
        Branch: ${{ github.ref_name }}

        All test jobs completed
        EOF

    - name: Upload test summary
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: test-summary
        path: test-reports/

    - name: Fail if required jobs failed
      run: |
        if [ "${{ needs.unit-tests.result }}" == "failure" ] || \
           [ "${{ needs.integration-tests.result }}" == "failure" ] || \
           [ "${{ needs.lint-and-quality.result }}" == "failure" ]; then
          echo "One or more required test jobs failed"
          exit 1
        fi
        echo "All required test jobs passed"
